name: Hidden Job Radar Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner
        run: |
          python scanner/main.py

      - name: Commit updated leads
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/leads.json
          git diff --cached --quiet || git commit -m "Update hidden job leads"
          git push
